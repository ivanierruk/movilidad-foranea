
# Packaging configuration for movilidad-foranea.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movilidad-foranea"
version = "1.0.0"
description = "Reproducible extraction of intercity bus routes and hotel geolocation in Mexico"
readme = "README.md"
requires-python = ">=3.10"      
license = "GPL-3.0-only" 

authors = [
  { name = "Ivan Espinosa" },
  { name = "Victor Reyes" },
]

dependencies = [
  "selenium",            # drives the Chrome browser
  "selenium-wire",       # network interception (GraphQL capture) for Booking
  "webdriver-manager",   # downloads/manages ChromeDriver automatically
  "pandas",              # tabular data handling
  "openpyxl",            # required for pandas to write .xlsx files
  "tqdm",                # progress bars during scraping
  "pyyaml",              # reads the config.yaml file
  "brotli",              # decompresses Brotli-encoded responses in Booking
  "pandera",             # output data-frame schema validation
  "tenacity",            # retry logic for transient Selenium failures
  # selenium-wire is unmaintained and needs an older TLS/HTTP stack; without
  # these upper bounds a fresh install pulls versions that break its traffic
  # interception (net::ERR_CONNECTION_CLOSED). requirements.txt pins the full
  # reproducible environment.
  "blinker<1.8",         # selenium-wire imports blinker._saferef (removed in >= 1.8)
  "setuptools<80",       # provides pkg_resources (dropped in newer setuptools)
  "cryptography<46",     # selenium-wire TLS interception breaks with newer versions
  "pyOpenSSL<26",        # same: TLS interception
  "kaitaistruct<0.11",   # selenium-wire TLS ClientHello parsing
]
 
[project.optional-dependencies]
# Development/test tooling. Install with:  pip install -e ".[test]"
test = ["pytest"]

[project.scripts]
# Creates the "movilidad-foranea" command in the terminal.
# It points to the main() function in cli.py.
movilidad-foranea = "movilidad_foranea.cli:main"

[tool.hatch.build.targets.wheel]
# tells hatchling that the package code lives under src/
packages = ["src/movilidad_foranea"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run excludes integration tests, so CI run only the 
# stable unit test. 
addopts = "-m 'not integration'"
markers = [
    "integration: requires Google Chrome / network; run manually with -m integration",
]

# Silence a known upstream DeprecationWarning from selenium-wire's bundled 
# (pkg_resources API). It is not emmited by this package's code and does 
# not affect correctness. 
filterwarnings = ["ignore::DeprecationWarning:seleniumwire.*",]


